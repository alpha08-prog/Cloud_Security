# Prometheus for the IsoLab provider plane. Scrapes the auditor's exporter, which
# publishes per-tenant usage/pressure, check results and detections.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: cloudaudit
    static_configs:
      - targets: ["auditor:8088"]
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
