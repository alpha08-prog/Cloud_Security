# HARDENED profile: the controls derived from Gonzalez et al. (2012), p.16.
#
#   R1 identification - identity labels on every container, network and volume;
#                       images built from a digest-pinned base with provenance labels
#   R2 separation     - a dedicated physical-core cpuset, CPU quota, memory (no swap)
#                       and PID limits per tenant; one internal network and one volume
#                       per tenant; non-root, no capabilities, no privilege gain,
#                       default seccomp, read-only root filesystem
#   R3/R4             - provided by the provider plane (auditor, Prometheus), which is
#                       identical in both profiles
#
# CPU sets come from testbed/cpus.env, generated by `lab.py cpus` from the host's
# real core/thread topology so that no two tenants share a physical core.

x-tenant: &tenant
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp:size=16m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 64

services:
  tenant-a:
    <<: *tenant
    cpuset: ${CPUSET_TENANT_A:?run scripts/lab.py cpus}
    cpus: ${CPUS_TENANT_A:?run scripts/lab.py cpus}
    mem_limit: 256m
    memswap_limit: 256m
    networks: [net-a]
    volumes: [a-data:/data]
    labels:
      io.isolab.plane: tenant
      io.isolab.tenant: a
      io.isolab.owner: payments-team
      io.isolab.workload-id: a-payments-api

  tenant-b:
    <<: *tenant
    cpuset: ${CPUSET_TENANT_B:?run scripts/lab.py cpus}
    cpus: ${CPUS_TENANT_B:?run scripts/lab.py cpus}
    mem_limit: 256m
    memswap_limit: 256m
    networks: [net-b]
    volumes: [b-data:/data]
    labels: &b-labels
      io.isolab.plane: tenant
      io.isolab.tenant: b
      io.isolab.owner: analytics-team
      io.isolab.workload-id: b-batch-analytics

  tenant-b-job:
    <<: *tenant
    # Same tenant, same dedicated cores: the job can only exhaust tenant-b's share.
    cpuset: ${CPUSET_TENANT_B:?run scripts/lab.py cpus}
    cpus: ${CPUS_TENANT_B:?run scripts/lab.py cpus}
    mem_limit: 256m
    memswap_limit: 256m
    network_mode: none
    labels:
      <<: *b-labels
      io.isolab.workload-id: b-batch-job

  tenant-c:
    <<: *tenant
    build:
      args:
        BASE_IMAGE: python:3.12-alpine3.22@sha256:a190708a2dec1bd18b1decb539f8e8f5407abaa9bf39cacda583f7f8c11db322
      labels:
        org.opencontainers.image.source: https://github.com/alpha08-prog/Cloud_Security
        org.opencontainers.image.revision: ${GIT_SHA:-dev}
        org.opencontainers.image.base.name: python:3.12-alpine3.22@sha256:a190708a2dec1bd18b1decb539f8e8f5407abaa9bf39cacda583f7f8c11db322
    image: isolab/legacy-app:hardened
    cpuset: ${CPUSET_TENANT_C:?run scripts/lab.py cpus}
    cpus: ${CPUS_TENANT_C:?run scripts/lab.py cpus}
    mem_limit: 128m
    memswap_limit: 128m
    networks: [net-c]
    volumes: [c-data:/data]
    labels:
      io.isolab.plane: tenant
      io.isolab.tenant: c
      io.isolab.owner: legacy-team
      io.isolab.workload-id: c-legacy-app

networks:
  net-a:
    internal: true
    labels: {io.isolab.plane: tenant, io.isolab.tenant: a}
  net-b:
    internal: true
    labels: {io.isolab.plane: tenant, io.isolab.tenant: b}
  net-c:
    internal: true
    labels: {io.isolab.plane: tenant, io.isolab.tenant: c}

volumes:
  a-data:
    labels: {io.isolab.plane: tenant, io.isolab.tenant: a}
  b-data:
    labels: {io.isolab.plane: tenant, io.isolab.tenant: b}
  c-data:
    labels: {io.isolab.plane: tenant, io.isolab.tenant: c}
