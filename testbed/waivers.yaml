- checkId: HV-03
  platform: docker-desktop-wsl2
  reason: >-
    The WSL2 kernel reports spec_rstack_overflow as "Vulnerable: Safe RET, no microcode".
    The SRSO microcode fix is delivered through the physical host's firmware/Windows updates;
    the container host (a WSL2 VM) cannot load microcode itself. This is a provider-layer
    weakness outside the testbed's control - the paper's point about tenants depending on a
    hypervisor they cannot inspect or fix.
  expires: 2026-12-31
  approvedBy: project owner (pending review)

- checkId: HV-04
  platform: docker-desktop-wsl2
  reason: >-
    User-namespace remapping and rootless mode are not available in Docker Desktop without
    Enhanced Container Isolation (Business subscription). Compensating controls: every tenant
    runs as uid 10001 with all capabilities dropped, no-new-privileges and seccomp.
  expires: 2026-12-31
  approvedBy: project owner (pending review)
