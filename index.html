<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive explorer of Gonzalez et al. (2012), a quantitative analysis of cloud-computing security concerns and solutions."
    />
    <title>Cloud Security Threat Lab</title>
    <script>
      // Resolve the theme before first paint to avoid a light/dark flash.
      // Storage key must match src/hooks/useTheme.ts.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('ctl-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
